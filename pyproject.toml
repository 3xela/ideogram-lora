[project]
name = "ideogram4-lora-starter"
version = "0.1.0"
description = "A minimal experimental LoRA training + inference scaffold for Ideogram 4 open weights. Unofficial, non-commercial."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lora", "text-to-image", "flow-matching", "ideogram", "fine-tuning"]

dependencies = [
  "torch>=2.11",
  "ideogram4",
  "transformers>=4.49.0",
  "safetensors>=0.4.5",
  "huggingface_hub>=0.26.0",
  "bitsandbytes>=0.49.2",
  "einops>=0.7.0",
  "accelerate>=1.0.0",
  "sentencepiece",
  "pillow",
  "numpy",
  "tqdm",
]

# `ideogram4` is not on PyPI yet; install it straight from GitHub.
[tool.uv.sources]
ideogram4 = { git = "https://github.com/ideogram-oss/ideogram4" }

[tool.ruff]
line-length = 100
